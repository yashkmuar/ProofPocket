services:
  db:
    image: pgvector/pgvector:pg16
    container_name: proofpocket-db
    environment:
      POSTGRES_USER: proofpocket
      POSTGRES_PASSWORD: proofpocket
      POSTGRES_DB: proofpocket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpocket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
